<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon Battle Arena</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="battle-arena">
      <h1>Pokemon Battle Arena</h1>

      <section class="statusBattle">
        <div id="gameOverStatus"></div>
        <div id="lastWinStatus"></div>
        <div id="scoreBoard">Player A: 0 wins / Player B: 0 wins</div>
      </section>

      <section class="battle-box">
        <div class="pokemon-card Player_A">
          <h2>Player A</h2>
          <input
            id="a-input"
            type="text"
            value="pikachu"
            list="pokemon-datalist"
          />
          <button id="a-btn" type="button">Search</button>
          <div id="a-result"></div>
        </div>

        <div class="pokemon-card Player_B">
          <h2>Player B</h2>
          <input
            id="b-input"
            type="text"
            value="charizard"
            list="pokemon-datalist"
          />
          <button id="b-btn" type="button">Search</button>
          <div id="b-result"></div>
        </div>
      </section>

      <datalist id="pokemon-datalist"></datalist>

      <section class="battle-controls">
        <button id="battle-btn" type="button" class="ocultar">Battle!</button>
      </section>
      <button id="reset-btn" type="button">Reset full game</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
